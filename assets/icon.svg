<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Poly To Track: a wireframe poly-mesh (the imported model) becoming an
       isometric stack of PolyTrack blocks. Reads at 30px in the mod loader. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101726"/>
      <stop offset="1" stop-color="#182338"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- incoming triangle mesh, top-left -->
  <g stroke="#7fd4ff" stroke-width="1.6" fill="none" stroke-linejoin="round" opacity="0.9">
    <path d="M9 22 L20 8 L27 20 Z"/>
    <path d="M9 22 L27 20 L17 30 Z"/>
  </g>
  <!-- mesh vertices -->
  <g fill="#bfe9ff">
    <circle cx="20" cy="8" r="1.8"/>
    <circle cx="9" cy="22" r="1.8"/>
    <circle cx="27" cy="20" r="1.8"/>
    <circle cx="17" cy="30" r="1.8"/>
  </g>

  <!-- conversion arrow -->
  <path d="M30 24 q6 4 4 11" stroke="#9aa7bd" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M31.4 33.2 L34 35.8 L36.6 32.4" stroke="#9aa7bd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- isometric voxel stack, bottom-right: three blocks (green track palette,
       one orange accent) with distinct top/left/right face shades -->
  <!-- back-left block -->
  <g>
    <path d="M26 44 L36 39 L46 44 L36 49 Z" fill="#63d98a"/>
    <path d="M26 44 L36 49 L36 58 L26 53 Z" fill="#2f9e57"/>
    <path d="M46 44 L36 49 L36 58 L46 53 Z" fill="#1f7a41"/>
  </g>
  <!-- right block -->
  <g>
    <path d="M38 50 L48 45 L58 50 L48 55 Z" fill="#63d98a"/>
    <path d="M38 50 L48 55 L48 63 L38 58 Z" fill="#2f9e57"/>
    <path d="M58 50 L48 55 L48 63 L58 58 Z" fill="#1f7a41"/>
  </g>
  <!-- top block (orange accent — the freshly placed one) -->
  <g>
    <path d="M31 35 L41 30 L51 35 L41 40 Z" fill="#ffb454"/>
    <path d="M31 35 L41 40 L41 49 L31 44 Z" fill="#e0862f"/>
    <path d="M51 35 L41 40 L41 49 L51 44 Z" fill="#b8641d"/>
  </g>
</svg>
